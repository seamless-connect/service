services:
  serviceprovider:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["./serviceProvider", "--config", "sample.conf"]
    ports:
      - "9270:9270"
      - "9271:9271"
    depends_on:
      otel-collector:
        condition: service_started

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel-collector/otelCollector.yaml:/etc/otelcol/config.yaml:ro
      - ./otel-collector/otelCollector.log:/etc/otelcol/output.log:rw
    ports:
      - "4317:4317" # OTLP gRPC receiver
      - "4318:4318" # OTLP HTTP/protobuf receiver
      - "8888:8888" # Prometheus metrics scrape endpoint with collector telemetry
      - "8889:8889" # Prometheus metrics exporter (scrape endpoint)
      - "13133:13133" # health_check extension
      - "54526:54526" # tcplog receiver
    depends_on:
      - prometheus
      - tempo
      - loki
      - pyroscope

  grafana:
    image: grafana/grafana:latest
    volumes:
      - ./grafana/grafana.ini:/etc/grafana/grafana.ini
      - ./grafana/dashboards:/provisioning/dashboards
      - ./grafana/provisioning:/etc/grafana/provisioning
    environment:
      OTEL_RESOURCE_ATTRIBUTES: "service.name=grafana"
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - tempo
      - loki
      - pyroscope

  prometheus:
    image: prom/prometheus:latest
    command:
      - "--web.enable-remote-write-receiver"
      - "--web.enable-otlp-receiver"
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"

  tempo:
    image: grafana/tempo:latest
    command:
      - "-config.file=/etc/tempo.yaml"
    volumes:
      - ./tempo/tempo.yaml:/etc/tempo.yaml
    ports:
      - "3200:3200" # tempo API / UI query endpoint

  loki:
    image: grafana/loki:latest
    command:
      - "-config.file=/etc/loki/loki.yaml"
    volumes:
      - ./loki/loki.yaml:/etc/loki/loki.yaml
    ports:
      - "3100:3100"

  pyroscope:
    image: pyroscope/pyroscope:latest
    command:
      - "server"
    volumes:
      - ./pyroscope/server.yaml:/etc/pyroscope/server.yaml
    ports:
      - "4040:4040"
