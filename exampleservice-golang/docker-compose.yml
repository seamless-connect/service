version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - APP_DOMAIN=exampleservice.domainconnect.local
      - APP_PROTOCOL=http
      - APP_IP=0.0.0.0
    ports:
      - "8080:8080"

  nginx:
    image: nginx:alpine
    ports:
      - "8001:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - web
