# Log level can be one of: trace debug info warn error fatal panic
loglevel = "debug"

# API listen.
# The 'host' field can be IP or DNS name
# The 'prefix' part of URI in between host and the Domain Connect name
#     space, for example https://{host}/{prefix}/v2/{domain}/settings
[api]
    host = "0.0.0.0"
    port = 9270
    prefix = "/example"

# OpenTelemetry setup.
# Traces, metrics and logs are all pushed to the same OTLP collector over gRPC.
[telemetry]
    # 'host:port' of the OTLP collector. Leave empty to only populate the
    # scrape endpoint and not push anything.
    endpoint = "otel-collector:4317"
    # Set to false to require TLS.
    insecure = true
    # Sampling of requests that are sent to collector.  Zero (0.0) means
    # discard everything, and one (1.0) all requests.
    ratio = 1.0
    # Add Go runtime and process metrics to the output.
    runtimemetrics = true

# OpenTelemetry metrics scrape endpoint.
# The 'host' field can be IP or DNS name
[metrics]
    host = "127.0.0.1"
    port = 9271
    path = "/metrics"

############################
# Domain Connect Templates #
############################

# Templates known by the serviceProvider instance
[templates]
    # Format: ['templates'.<string>]
    [templates.template1]
        source = "file:///home/kerolasa/src/Templates/exampleservice.domainconnect.org.template1.json"
        # Output of: openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out private-key-dc-1.pem
        secretKey = "./serviceProvider/private-key-dc-1.pem"
        secretType = "RS256"
        # This is the host part of syncPubKeyDomain TXT record
        pubKeyHost = "dc-1"
    [templates.template2]
        #source = "https://raw.githubusercontent.com/Domain-Connect/Templates/refs/heads/master/exampleservice.domainconnect.org.template2.json"
        source = "file:///home/kerolasa/src/Templates/exampleservice.domainconnect.org.template2.json"
        # Output of: openssl genpkey -algorithm Ed25519 -out private-key-dc-2.pem
        secretKey = "./serviceProvider/private-key-dc-2.pem"
        secretType = "Ed25519"
        pubKeyHost = "dc-2"

# EOF
