# Log level can be one of: trace debug info warn error fatal panic
loglevel = "debug"

# API listen.
# The 'host' field can be IP or DNS name
# The 'prefix' part of URI in between host and the Domain Connect name
#     space, for example https://{host}/{prefix}/v2/{domain}/settings
[api]
    host = "0.0.0.0"
    port = 9270
    prefix = "/example"

# OpenTelemetry setup.
# Traces, metrics and logs are all pushed to the same OTLP collector over gRPC.
[telemetry]
    # 'host:port' of the OTLP collector. Leave empty to only populate the
    # scrape endpoint and not push anything.
    endpoint = "otel-collector:4317"
    # Set to false to require TLS.
    insecure = true
    # Sampling of requests that are sent to collector.  Zero (0.0) means
    # discard everything, and one (1.0) all requests.
    ratio = 1.0
    # Add Go runtime and process metrics to the output.
    runtimemetrics = true

# OpenTelemetry metrics scrape endpoint.
# The 'host' field can be IP or DNS name
[metrics]
    host = "127.0.0.1"
    port = 9271
    path = "/metrics"

# EOF
